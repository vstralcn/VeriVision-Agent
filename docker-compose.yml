version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: deepfake-postgres
    environment:
      POSTGRES_USER: deepfake_user
      POSTGRES_PASSWORD: deepfake_pass
      POSTGRES_DB: deepfake_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfake_user -d deepfake_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: deepfake-backend
    environment:
      DATABASE_URL: postgresql://deepfake_user:deepfake_pass@postgres:5432/deepfake_db
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
